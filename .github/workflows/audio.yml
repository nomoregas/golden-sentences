# Regenerate audio/ with Microsoft's neural German voices and commit the result.
# Run it from the repo's Actions tab: "Generate audio" → Run workflow.
name: Generate audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voice (e.g. de-DE-KatjaNeural, de-DE-ConradNeural, de-DE-AmalaNeural)"
        default: de-DE-KatjaNeural
        required: true

permissions:
  contents: write
  actions: write

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python3 tools/make_audio.py --engine edge --voice "${{ inputs.voice }}"
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Regenerate audio with ${{ inputs.voice }}"
          git push
      # Pushes made with the workflow token don't start other workflows, so ask for a site rebuild.
      - name: Publish the app with the new audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
